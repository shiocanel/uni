<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lidl.ro</title>


    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
        }

        .container{
            width: 98%;
            height: 100vh;
            background-color: red;
        }

        header{
            width: 100%;
            height: 22vh;
            background-color: white;
        }

        .head_sec1{
            width: 100%;
            height: 40%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .head_sec2{
            width: 100%;
            height: 60%;
            background-color: #0050AA;
        }

        .head_sec1 a{
            background-color: gray;
            padding: 10px;
            border-radius: 120px;
            color: white;
            font-size: 14px;
            margin-left: 15%;
        }

        .head_sec1 .chestii{
            display: flex;
            justify-content: space-between;
            width: 11%;
        }

        .chestii .chestie{
            background-color: black;
            width: 50px;
            height: 50px;
        }

        .head_sec2{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .head_jos1 h1{
            color: white;
            font-size: 40px;
        }

        .head_jos1 h4{
            color: white;
            font-size: 15px;
        }



    </style>

</head>
<body>
    
    <div class="container">
        <header>
            <div class="head_sec1">
                <a href="">Selecteaza magazinul Lidl pentru oferte speciale din zo..</a>
                <div class="chestii">
                    <div class="chestie"></div>
                    <div class="chestie"></div>
                    <div class="chestie"></div>
                </div>
            </div>
            <div class="head_sec2">
                <div class="head_jos1">
                    <h1>Inscrie-te acum</h1>
                    <h4>Autentifica-te in cont</h4>
                </div>
                <div class="head_jos2">
                    <a href="">Gasiti produsul, marca, categoria preferata... <a href=""></a></a>
                </div>
            </div>
        </header>
    </div>

</body>
</html>
